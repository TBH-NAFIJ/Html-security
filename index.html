
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RX Code Protector</title>

<script src="https://cdn.jsdelivr.net/npm/javascript-obfuscator@4.1.1/dist/index.browser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/csso@5.0.5/dist/csso.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: #080f1d;
    color: #fff;
    font-family: Inter, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 480px;
    background: #111d30;
    border: 1px solid #243a56;
    border-radius: 18px;
    padding: 24px;
}

h2 {
    font-family: Rajdhani, Arial, sans-serif;
    text-align: center;
    color: #00d9ff;
    font-size: 30px;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #9aacc3;
    font-size: 13px;
    margin-bottom: 25px;
}

.upload {
    display: block;
    border: 2px dashed #31516f;
    border-radius: 13px;
    padding: 30px 15px;
    text-align: center;
    cursor: pointer;
    background: #0c1728;
}

.upload strong {
    display: block;
    color: #00d9ff;
    margin-bottom: 8px;
}

.upload span {
    color: #9aacc3;
    font-size: 12px;
}

input[type=file] {
    display: none;
}

.file-name {
    margin-top: 15px;
    color: #00d9ff;
    font-size: 13px;
    text-align: center;
    overflow-wrap: anywhere;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
    background: #00c8ed;
    color: #061321;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.download {
    background: #153d36;
    color: #4dffc3;
    display: none;
}

.status {
    margin-top: 18px;
    background: #0a1627;
    padding: 13px;
    border-radius: 9px;
    color: #a9bfd8;
    font-size: 13px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.progress {
    width: 100%;
    height: 5px;
    background: #24364b;
    border-radius: 10px;
    margin-top: 15px;
    overflow: hidden;
    display: none;
}

.bar {
    height: 100%;
    width: 0%;
    background: #00d9ff;
    transition: width .3s;
}

.notice {
    color: #8398b2;
    font-size: 11px;
    text-align: center;
    margin-top: 20px;
    line-height: 1.7;
}
</style>
</head>

<body>

<div class="container">

    <h2>RX CODE PROTECTOR</h2>

    <div class="subtitle">
        HTML + CSS + JavaScript Protection Tool
    </div>

    <label class="upload" for="fileInput">
        <strong>UPLOAD HTML FILE</strong>
        <span>Click here to select your .html file</span>
        <input type="file" id="fileInput" accept=".html,.htm,text/html">
    </label>

    <div class="file-name" id="fileName">
        No file selected
    </div>

    <button id="protectBtn" disabled>
        PROTECT CODE
    </button>

    <div class="progress" id="progress">
        <div class="bar" id="bar"></div>
    </div>

    <div class="status" id="status">
        Waiting for HTML file...
    </div>

    <button class="download" id="downloadBtn">
        DOWNLOAD PROTECTED HTML
    </button>

    <div class="notice">
        RX CODE PROTECTOR<br>
        Browser-side processing · No source upload
    </div>

</div>

<script>
"use strict";

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const protectBtn = document.getElementById("protectBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusBox = document.getElementById("status");
const progress = document.getElementById("progress");
const bar = document.getElementById("bar");

let originalFileName = "";
let originalCode = "";
let protectedCode = "";
let busy = false;

function updateStatus(message) {
    statusBox.textContent = message;
}

function setProgress(value) {
    bar.style.width = value + "%";
}

fileInput.addEventListener("change", async function () {

    const file = this.files[0];

    protectedCode = "";
    downloadBtn.style.display = "none";

    if (!file) {
        originalCode = "";
        protectBtn.disabled = true;
        fileName.textContent = "No file selected";
        return;
    }

    if (!/\.(html|htm)$/i.test(file.name)) {
        originalCode = "";
        protectBtn.disabled = true;
        fileName.textContent = "Invalid file";
        updateStatus("Please upload a valid HTML file.");
        this.value = "";
        return;
    }

    if (file.size > 10 * 1024 * 1024) {
        originalCode = "";
        protectBtn.disabled = true;
        updateStatus("File is too large. Maximum size is 10 MB.");
        this.value = "";
        return;
    }

    try {
        originalCode = await file.text();
        originalFileName = file.name;

        if (!originalCode.trim()) {
            throw new Error("The HTML file is empty.");
        }

        fileName.textContent = file.name;
        protectBtn.disabled = false;

        updateStatus(
            "File loaded successfully.\n" +
            "Original size: " + formatSize(file.size) +
            "\nReady to protect."
        );

    } catch (error) {
        originalCode = "";
        protectBtn.disabled = true;
        updateStatus("File reading failed: " + error.message);
    }
});

function formatSize(bytes) {
    if (bytes < 1024) return bytes + " Bytes";
    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(2) + " KB";
    }
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function isExecutableScript(script) {

    const type = (
        script.getAttribute("type") || ""
    ).trim().toLowerCase();

    return (
        type === "" ||
        type === "module" ||
        type === "text/javascript" ||
        type === "application/javascript" ||
        type === "application/ecmascript" ||
        type === "text/ecmascript"
    );
}

function removeHTMLComments(root) {

    const walker = document.createTreeWalker(
        root,
        NodeFilter.SHOW_COMMENT
    );

    const comments = [];
    let node;

    while ((node = walker.nextNode())) {
        comments.push(node);
    }

    for (const comment of comments) {
        const value = comment.nodeValue || "";

        // Preserve conditional comments for compatibility.
        if (/^\s*\[if\b/i.test(value)) continue;

        comment.remove();
    }
}

function processHTML(source) {

    return new Promise(async function (resolve, reject) {

        try {

            if (
                typeof JavaScriptObfuscator === "undefined" ||
                typeof csso === "undefined"
            ) {
                throw new Error(
                    "Protection libraries could not load. Check your internet connection and reload."
                );
            }

            const parser = new DOMParser();

            const doc = parser.parseFromString(
                source,
                "text/html"
            );

            if (!doc.documentElement) {
                throw new Error("Invalid HTML document.");
            }

            const scripts = Array.from(
                doc.querySelectorAll("script")
            );

            const styles = Array.from(
                doc.querySelectorAll("style")
            );

            const total = scripts.length + styles.length + 2;
            let completed = 0;

            function advance() {
                completed++;
                setProgress(
                    Math.min(95, Math.round(completed / total * 100))
                );
            }

            // 1. Process inline CSS.
            for (const style of styles) {

                try {

                    const css = style.textContent || "";

                    if (css.trim()) {

                        const result = csso.minify(css, {
                            restructure: false,
                            comments: true
                        });

                        style.textContent = result.css;
                    }

                } catch (error) {
                    console.warn("CSS processing skipped:", error);
                }

                advance();
            }

            // 2. Process inline JavaScript.
            for (const script of scripts) {

                try {

                    const hasExternalSource =
                        script.hasAttribute("src");

                    if (
                        !hasExternalSource &&
                        isExecutableScript(script)
                    ) {

                        const js = script.textContent || "";

                        if (js.trim()) {

                            const result =
                                JavaScriptObfuscator.obfuscate(
                                    js,
                                    {
                                        compact: true,
                                        simplify: true,
                                        identifierNamesGenerator: "hexadecimal",
                                        renameGlobals: false,
                                        stringArray: true,
                                        stringArrayThreshold: 0.5,
                                        stringArrayEncoding: [],
                                        controlFlowFlattening: false,
                                        deadCodeInjection: false,
                                        disableConsoleOutput: false,
                                        selfDefending: false,
                                        debugProtection: false
                                    }
                                );

                            script.textContent = result.getObfuscatedCode();
                        }
                    }

                } catch (error) {

                    console.warn(
                        "JavaScript processing skipped:",
                        error
                    );
                }

                advance();
            }

            // 3. Remove ordinary HTML comments.
            removeHTMLComments(doc);

            advance();

            // 4. Generate final document.
            const doctype = doc.doctype
                ? "<!DOCTYPE " + doc.doctype.name + ">"
                : "<!DOCTYPE html>";

            const output =
                doctype + "\n" +
                doc.documentElement.outerHTML;

            if (!output || output.length === 0) {
                throw new Error("Could not generate protected HTML.");
            }

            advance();

            resolve(output);

        } catch (error) {
            reject(error);
        }

    });
}

protectBtn.addEventListener("click", async function () {

    if (busy || !originalCode) return;

    busy = true;
    protectBtn.disabled = true;
    downloadBtn.style.display = "none";
    progress.style.display = "block";
    setProgress(5);

    updateStatus("Protection started...\nPlease wait.");

    try {

        const start = performance.now();

        protectedCode = await processHTML(originalCode);

        const elapsed = (
            performance.now() - start
        ).toFixed(0);

        const originalSize = new Blob(
            [originalCode]
        ).size;

        const finalSize = new Blob(
            [protectedCode]
        ).size;

        const difference = originalSize - finalSize;

        const percentage = originalSize > 0
            ? ((difference / originalSize) * 100).toFixed(2)
            : "0.00";

        setProgress(100);

        updateStatus(
            "PROTECTION COMPLETED!\n\n" +
            "Original Size: " + formatSize(originalSize) + "\n" +
            "Protected Size: " + formatSize(finalSize) + "\n" +
            "Size Difference: " + formatSize(Math.abs(difference)) + "\n" +
            "Size Change: " + percentage + "%\n" +
            "Processing Time: " + elapsed + " ms\n\n" +
            "Your protected HTML is ready to download."
        );

        downloadBtn.style.display = "block";

    } catch (error) {

        protectedCode = "";

        updateStatus(
            "PROTECTION FAILED!\n\n" +
            (error.message || "Unknown processing error.")
        );

    } finally {

        busy = false;
        protectBtn.disabled = !originalCode;

    }

});

downloadBtn.addEventListener("click", function () {

    if (!protectedCode) return;

    const blob = new Blob(
        [protectedCode],
        { type: "text/html;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    const baseName = originalFileName
        .replace(/\.(html|htm)$/i, "");

    link.href = url;
    link.download = baseName + "-protected.html";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(function () {
        URL.revokeObjectURL(url);
    }, 1000);

    updateStatus(
        "Download started successfully.\n" +
        "File: " + baseName + "-protected.html"
    );

});

</script>

</body>
</html>
